<script>
// =====================================================================================

// =====================================================================================
const W=1600,H=900,END=142.5;
// timeline stretched to fit the narration: [new_time, story_time] breakpoints
const WARP=[[0.0, 0.0], [1.0, 1.0], [6.523, 4.5], [7.023, 5.0], [12.076, 9.0], [12.576, 9.5], [18.973, 14.0], [19.173, 14.2], [23.139, 17.5], [23.639, 18.0], [28.991, 22.0], [29.291, 22.3], [31.827, 24.5], [32.327, 25.0], [35.076, 27.0], [35.576, 27.5], [39.989, 30.5], [40.289, 30.8], [42.804, 32.8], [43.204, 33.2], [47.831, 36.5], [48.131, 36.8], [51.591, 39.5], [52.091, 40.0], [57.4, 43.5], [57.7, 43.8], [60.065, 45.5], [60.565, 46.0], [66.643, 50.0], [67.143, 50.5], [70.191, 53.0], [70.691, 53.5], [75.765, 56.5], [76.265, 57.0], [79.192, 59.0], [79.692, 59.5], [85.84, 63.0], [86.34, 63.5], [92.631, 67.5], [93.131, 68.0], [95.581, 70.0], [96.081, 70.5], [98.381, 72.8], [99.181, 75.2], [104.043, 79.5], [104.343, 79.8], [109.055, 83.8], [109.455, 84.2], [113.271, 87.0], [113.771, 87.5], [120.388, 91.0], [120.888, 91.5], [125.173, 94.5], [125.673, 95.0], [129.788, 97.8], [130.188, 98.2], [134.388, 101.2], [134.888, 101.7], [140.539, 106.0], [141.039, 106.5], [144.343, 109.5], [144.843, 110.0], [150.067, 114.5], [150.567, 115.0], [155.456, 117.0], [155.956, 117.5], [159.629, 120.0], [159.929, 120.3], [162.129, 122.5], [162.629, 123.0], [166.467, 125.5], [166.967, 126.0], [171.017, 129.0], [171.517, 129.5], [174.352, 132.0], [174.852, 132.5], [179.031, 136.0], [179.531, 136.5], [186.568, 142.0], [187.068, 142.5]], TOTAL=187.068;
function storyTime(t){for(let i=1;i<WARP.length;i++){const [a1,o1]=WARP[i],[a0,o0]=WARP[i-1];if(t<=a1)return a1>a0?o0+(o1-o0)*(t-a0)/(a1-a0):o0;}return END;}
let RT=0;   // real (video) time: drives water, grass, blinking and mouth flaps so stretched scenes never look slow-motion
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0;
function resize(){const d=window.__RENDER?1:Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;
  scale=Math.max(cv.width/W,cv.height/H);ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;}
addEventListener('resize',resize);resize();

// ---------------- helpers ----------------
let seed=21;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function noise(n){const v=[];for(let i=0;i<n;i++)v.push(rnd());
  return x=>{const i=Math.floor(x),f=x-i,a=v[((i%n)+n)%n],b=v[(((i+1)%n)+n)%n],s=f*f*(3-2*f);return a+(b-a)*s;};}
const fbm=(nz,u)=>nz(u)*.55+nz(u*2)*.27+nz(u*4)*.12+nz(u*8)*.06;
function off(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c;}
function lin(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>gr.addColorStop(s[0],s[1]));return gr;}
function rad(g,x,y,r,st,x1,y1){const gr=g.createRadialGradient(x1??x,y1??y,0,x,y,r);st.forEach(s=>gr.addColorStop(s[0],s[1]));return gr;}
const mod=(a,b)=>((a%b)+b)%b, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,k)=>a+(b-a)*k;
const sm=k=>{k=clamp(k);return k*k*(3-2*k);}, seg=(t,a,b)=>clamp((t-a)/(b-a));
const INK='rgba(55,30,15,0.85)';
function fs(g,fill,stroke=INK,lw=2){g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.lineJoin='round';g.stroke();}}
const inW=(t,a,b)=>t>=a&&t<b;
const talkAmt=(t,on)=>on?0.35+0.65*Math.abs(Math.sin(RT*13))*(0.6+0.4*Math.sin(RT*4.7)):0;

// ---------------- world layout ----------------
const GY=585, WY=606;                 // left-bank ground top, water surface
const RIVER_L=600, RIVER_R=3320;      // river spans between the banks
const TREE_X=170, BRANCH_Y=338, SEAT_X=318;   // climbing tree (trunk x), branch height, monkey seat
const VINE={x:-520,y:-40,len:440};
const BANK_X=470;                     // where the monkey stands at the river's edge

// ---------------- sky & far layers (screen space, parallax) ----------------
const sky=off(W,H,g=>{
  g.fillStyle=lin(g,0,0,0,H,[[0,'#3f8fd6'],[.45,'#8fd0f0'],[.72,'#d8f1f2'],[1,'#f4f7e2']]);g.fillRect(0,0,W,H);
  g.fillStyle=rad(g,1250,140,700,[[0,'rgba(255,253,230,1)'],[.07,'rgba(255,246,200,.85)'],[.3,'rgba(255,240,190,.25)'],[1,'rgba(255,240,190,0)']]);g.fillRect(0,0,W,H);
});
function cloud(w,h){return off(w,h,g=>{
  const puffs=[];for(let i=0;i<9;i++)puffs.push([w*.18+i/8*w*.64+(rnd()-.5)*20,h*.55-Math.sin(i/8*Math.PI)*h*.22+(rnd()-.5)*10,h*.14+Math.sin(i/8*Math.PI)*h*.12+rnd()*10]);
  g.filter='blur(1.5px)';
  for(const [x,y,r] of puffs){g.fillStyle='rgba(185,205,230,1)';g.beginPath();g.arc(x,y+6,r,0,7);g.fill();}
  for(const [x,y,r] of puffs){g.fillStyle=rad(g,x,y,r,[[0,'#ffffff'],[.7,'#f7fbff'],[1,'#dfe8f5']],x+r*.3,y-r*.4);g.beginPath();g.arc(x,y,r*.94,0,7);g.fill();}
});}
const clouds=[{img:cloud(420,170),x:80,y:40},{img:cloud(330,140),x:700,y:120},{img:cloud(470,190),x:1150,y:30},{img:cloud(300,120),x:1550,y:170}];

function ridgeLayer(baseY,amp,n,c1,c2,haze,palms){
  const nz=noise(n);
  return off(W*2,H,g=>{
    const pts=[];g.beginPath();g.moveTo(0,H);
    for(let x=0;x<=W*2;x+=4){const y=baseY-fbm(nz,x/(W*2)*n)*amp;pts.push([x,y]);g.lineTo(x,y);}
    g.lineTo(W*2,H);g.closePath();g.fillStyle=lin(g,0,baseY-amp,0,baseY+200,[[0,c1],[1,c2]]);g.fill();
    // rounded canopy bumps along the top
    for(let i=0;i<pts.length;i+=7){const [x,y]=pts[i];g.fillStyle=c1;g.beginPath();g.arc(x,y+6,10+rnd()*14,0,7);g.fill();}
    for(let i=0;i<palms;i++){const [x,y]=pts[Math.floor(rnd()*pts.length)],h=50+rnd()*60;
      for(const dx of [0,-W*2,W*2]){const X=x+dx;g.strokeStyle=c1;g.lineWidth=4;g.beginPath();g.moveTo(X,y+10);g.quadraticCurveTo(X+8,y-h/2,X+4,y-h);g.stroke();
        g.fillStyle=c1;for(let k=0;k<7;k++){const a=-Math.PI/2+(k-3)*.5;g.beginPath();g.ellipse(X+4+Math.cos(a)*16,y-h+Math.sin(a)*10+6,20,5,a,0,7);g.fill();}}}
    g.globalCompositeOperation='source-atop';g.fillStyle=`rgba(210,235,240,${haze})`;g.fillRect(0,0,W*2,H);
  });
}
const farHills=ridgeLayer(520,170,7,'#79a7b8','#a8cbd2',.35,0);
const midJungle=ridgeLayer(575,120,11,'#3f7d4a','#5d9a5a',.18,26);

// ---------------- jungle sprites ----------------
function leafShape(g,len,wid){g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(len*.5,-wid,len,0);g.quadraticCurveTo(len*.5,wid,0,0);}
function makePalm(h,lean){return off(420,h+140,g=>{
  const bx=210,by=h+130,tx=bx+lean,ty=140;
  // trunk with rings
  for(let i=0;i<=24;i++){const k=i/24,x=lerp(bx,tx,k)+Math.sin(k*3)*lean*.15,y=lerp(by,ty,k),w=lerp(16,9,k);
    g.beginPath();g.ellipse(x,y,w,7,0,0,7);fs(g,lin(g,x-w,0,x+w,0,[[0,'#5e4126'],[.6,'#9a7247'],[1,'#c19a66']]),'rgba(50,30,15,.7)',1.2);}
  // coconuts
  for(const [dx,dy] of [[-8,8],[6,10],[0,16]]){g.beginPath();g.arc(tx+dx,ty+dy,7,0,7);fs(g,rad(g,tx+dx,ty+dy,7,[[0,'#8a6a3a'],[1,'#4e3518']],tx+dx-2,ty+dy-2),INK,1.2);}
  // fronds
  for(let k=0;k<9;k++){const a=-Math.PI+k/8*Math.PI+(rnd()-.5)*.2,len=110+rnd()*40;
    g.save();g.translate(tx,ty);g.rotate(a);
    g.strokeStyle='#3d6b25';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(len*.5,-14,len,22);g.stroke();
    for(let j=1;j<16;j++){const u=j/16,px=len*u,py=-14*4*u*(1-u)+22*u*u;
      for(const sd of [-1,1]){g.save();g.translate(px,py);g.rotate(sd*1.1+.5);g.fillStyle=`hsl(${100+rnd()*20},55%,${30+rnd()*14}%)`;
        g.beginPath();g.ellipse(9,0,11*(1-u*.5),3,0,0,7);g.fill();g.restore();}}
    g.restore();}
});}
function makeJungleTree(w,h,dark){return off(w+80,h+40,g=>{
  const bx=(w+80)/2,by=h+30;
  // buttress roots + trunk
  g.beginPath();g.moveTo(bx-40,by);g.quadraticCurveTo(bx-18,by-20,bx-16,by-h*.55);g.lineTo(bx+16,by-h*.55);g.quadraticCurveTo(bx+18,by-20,bx+44,by);g.closePath();
  fs(g,lin(g,bx-40,0,bx+40,0,[[0,'#3b2a1a'],[.55,'#6d4c2e'],[1,'#8f6a43']]),'rgba(35,20,10,.8)',1.5);
  g.strokeStyle='rgba(30,18,8,.45)';g.lineWidth=1.3;for(let i=0;i<10;i++){const x=bx+(rnd()-.5)*24,y=by-rnd()*h*.5;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+3,y-10,x,y-22);g.stroke();}
  // canopy of big tropical leaves
  const cy=by-h*.62;
  const cl=[];for(let i=0;i<9;i++){const a=i/9*6.28;cl.push([bx+Math.cos(a)*w*.32,cy+Math.sin(a)*h*.16,w*.2+rnd()*w*.06]);}cl.push([bx,cy-h*.08,w*.26]);
  for(const [x,y,r] of cl){g.fillStyle=dark?'#1f4a22':'#285a28';g.beginPath();g.arc(x,y+5,r,0,7);g.fill();}
  for(const [x,y,r] of cl){g.fillStyle=rad(g,x,y,r,[[0,dark?'#3f7d3a':'#5aa546'],[1,dark?'#24502a':'#2f6a2c']],x+r*.3,y-r*.4);g.beginPath();g.arc(x,y,r*.95,0,7);g.fill();
    for(let k=0;k<26;k++){const a=rnd()*6.28,d=Math.sqrt(rnd())*r*.9,lx=x+Math.cos(a)*d,ly=y+Math.sin(a)*d,light=clamp(.5+((lx-x)*.5-(ly-y))/(r*2));
      g.save();g.translate(lx,ly);g.rotate(rnd()*6.28);leafShape(g,16+rnd()*8,6);g.fillStyle=`hsl(${105+rnd()*15},55%,${(dark?16:24)+light*30}%)`;g.fill();
      g.strokeStyle='rgba(20,50,20,.45)';g.lineWidth=.7;g.beginPath();g.moveTo(0,0);g.lineTo(18,0);g.stroke();g.restore();}}
  // hanging vines
  for(let i=0;i<5;i++){const vx=bx+(rnd()-.5)*w*.6,vy=cy+h*.05,len=h*(.25+rnd()*.35);
    g.strokeStyle='#3e6a2a';g.lineWidth=2;g.beginPath();g.moveTo(vx,vy);g.bezierCurveTo(vx+8,vy+len*.3,vx-8,vy+len*.6,vx+3,vy+len);g.stroke();
    for(let j=0;j<6;j++){const yy=vy+len*(j+1)/7;g.save();g.translate(vx+Math.sin(j)*5,yy);g.rotate(j%2?.6:2.5);leafShape(g,9,4);g.fillStyle='#4f8f36';g.fill();g.restore();}}
});}
function makeBanana(){return off(260,220,g=>{
  for(let k=0;k<7;k++){const a=-Math.PI/2+(k-3)*.42;g.save();g.translate(130,205);g.rotate(a);
    g.strokeStyle='#4e7d2a';g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.lineTo(60,0);g.stroke();
    g.translate(55,0);leafShape(g,120,30);fs(g,lin(g,0,-30,0,30,[[0,'#7fc457'],[.5,'#56a03c'],[1,'#33702a']]),'rgba(25,60,20,.7)',1.4);
    g.strokeStyle='rgba(230,255,200,.6)';g.lineWidth=1.4;g.beginPath();g.moveTo(0,0);g.lineTo(118,0);g.stroke();
    g.strokeStyle='rgba(30,70,25,.35)';g.lineWidth=.8;for(let j=1;j<10;j++){g.beginPath();g.moveTo(j*12,0);g.lineTo(j*12+10,j%2?-22:22);g.stroke();}
    g.restore();}
});}
function makeFern(){return off(200,120,g=>{
  for(let k=0;k<9;k++){const a=-Math.PI+.25+k/8*(Math.PI-.5);g.save();g.translate(100,115);g.rotate(a);
    g.strokeStyle='#3a6e26';g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(45,-10,85,8);g.stroke();
    for(let j=1;j<12;j++){const u=j/12;g.save();g.translate(85*u,-10*4*u*(1-u)+8*u*u);for(const sd of [-1,1]){g.save();g.rotate(sd*1.2);leafShape(g,12*(1-u*.6),3);g.fillStyle=`hsl(${105+rnd()*15},55%,${30+rnd()*14}%)`;g.fill();g.restore();}g.restore();}
    g.restore();}
});}
const palms=[makePalm(330,40),makePalm(380,-50),makePalm(300,20)];
const jtrees=[makeJungleTree(330,460,false),makeJungleTree(300,420,true),makeJungleTree(360,500,false)];
const banana=makeBanana(), fern=makeFern();
// the climbing tree with a long branch reaching toward the river
const climbTree=off(520,640,g=>{
  const bx=170,by=620; // sprite coords: trunk at bx, ground at by; branch at y=by-(GY-BRANCH_Y)
  const brY=by-(GY-BRANCH_Y);
  g.beginPath();g.moveTo(bx-44,by);g.quadraticCurveTo(bx-20,by-24,bx-20,by-200);g.lineTo(bx-17,by-440);g.lineTo(bx+17,by-440);g.lineTo(bx+20,by-200);g.quadraticCurveTo(bx+20,by-24,bx+48,by);g.closePath();
  fs(g,lin(g,bx-40,0,bx+40,0,[[0,'#3b2a1a'],[.55,'#6d4c2e'],[1,'#94704a']]),'rgba(35,20,10,.85)',2);
  g.strokeStyle='rgba(30,18,8,.45)';g.lineWidth=1.3;for(let i=0;i<16;i++){const x=bx+(rnd()-.5)*28,y=by-rnd()*420;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+3,y-10,x,y-24);g.stroke();}
  // the branch the monkey sits on
  g.beginPath();g.moveTo(bx+10,brY-14);g.quadraticCurveTo(bx+120,brY-22,bx+250,brY-6);g.quadraticCurveTo(bx+262,brY,bx+250,brY+5);g.quadraticCurveTo(bx+120,brY-2,bx+10,brY+16);g.closePath();
  fs(g,lin(g,0,brY-20,0,brY+16,[[0,'#94704a'],[1,'#5a3e24']]),'rgba(35,20,10,.85)',2);
  for(const [x,y,r] of [[bx+250,brY-20,30],[bx+215,brY-34,24]]){g.fillStyle=rad(g,x,y,r,[[0,'#5aa546'],[1,'#2f6a2c']],x+8,y-10);g.beginPath();g.arc(x,y,r,0,7);g.fill();
    for(let k=0;k<14;k++){const a=rnd()*6.28,d=rnd()*r;g.save();g.translate(x+Math.cos(a)*d,y+Math.sin(a)*d);g.rotate(rnd()*6.28);leafShape(g,16,6);g.fillStyle=`hsl(${105+rnd()*15},55%,${28+rnd()*24}%)`;g.fill();g.restore();}}
  // big canopy on top
  const cy=by-470;const cl=[];for(let i=0;i<10;i++){const a=i/10*6.28;cl.push([bx+Math.cos(a)*110,cy+Math.sin(a)*55,62+rnd()*20]);}cl.push([bx,cy-25,80]);
  for(const [x,y,r] of cl){g.fillStyle='#285a28';g.beginPath();g.arc(x,y+5,r,0,7);g.fill();}
  for(const [x,y,r] of cl){g.fillStyle=rad(g,x,y,r,[[0,'#5aa546'],[1,'#2f6a2c']],x+r*.3,y-r*.4);g.beginPath();g.arc(x,y,r*.95,0,7);g.fill();
    for(let k=0;k<30;k++){const a=rnd()*6.28,d=Math.sqrt(rnd())*r*.9,lx=x+Math.cos(a)*d,ly=y+Math.sin(a)*d,light=clamp(.5+((lx-x)*.5-(ly-y))/(r*2));
      g.save();g.translate(lx,ly);g.rotate(rnd()*6.28);leafShape(g,18,7);g.fillStyle=`hsl(${105+rnd()*15},55%,${24+light*30}%)`;g.fill();g.restore();}}
  // bananas hanging
  for(let i=0;i<4;i++){g.save();g.translate(bx+60+i*8,cy+50);g.rotate(.3);g.beginPath();g.ellipse(0,0,4,12,0,0,7);fs(g,'#f7d23a','rgba(100,70,0,.7)',1);g.restore();}
});
const CT_OFF={x:170,y:620};   // sprite anchor of climbTree

// scatter of jungle props in world coordinates
const props=[];
(function(){
  for(let x=-2700;x<-260;x+=95+rnd()*70){const r=rnd();
    props.push({x,y:GY+4,layer:0,img:r<.4?palms[Math.floor(rnd()*3)]:jtrees[Math.floor(rnd()*3)],ax:.5,ay:1,s:.8+rnd()*.4});}
  for(let x=-2650;x<-200;x+=70+rnd()*60) if(x<-800||x>-260) props.push({x,y:GY+8,layer:1,img:rnd()<.5?banana:fern,ax:.5,ay:1,s:.7+rnd()*.5});
  for(let x=RIVER_R+80;x<4600;x+=110+rnd()*60){const r=rnd();props.push({x,y:GY+4,layer:0,img:r<.5?palms[Math.floor(rnd()*3)]:jtrees[Math.floor(rnd()*3)],ax:.5,ay:1,s:.8+rnd()*.4});}
  for(let x=RIVER_R+60;x<4600;x+=80+rnd()*60) props.push({x,y:GY+8,layer:1,img:rnd()<.5?banana:fern,ax:.5,ay:1,s:.7+rnd()*.5});
  // a couple of palms well back from the bank (not near enough to help cross the river)
  props.push({x:-160,y:GY+4,layer:0,img:palms[1],ax:.5,ay:1,s:.9});
})();
const tufts=[];for(let x=-2700;x<4600;x+=9){if(x>RIVER_L-20&&x<RIVER_R+20)continue;tufts.push({x,h:6+rnd()*12,c:`hsl(${90+rnd()*30},55%,${26+rnd()*16}%)`,ph:rnd()*6});}
const flowersW=[];for(let i=0;i<70;i++){let x=-2600+rnd()*7200;if(x>RIVER_L-40&&x<RIVER_R+40)continue;flowersW.push({x,c:['#ff5d8f','#ffd23f','#ff7a3d','#c77dff','#ffffff'][i%5]});}
const lily=[];for(let i=0;i<14;i++){const near=i%2?RIVER_L+40+rnd()*260:RIVER_R-40-rnd()*260;lily.push({x:near,y:WY+6+rnd()*30,r:14+rnd()*10,fl:rnd()<.4});}
const reeds=[];for(let i=0;i<30;i++){const x=i<15?RIVER_L-30+rnd()*70:RIVER_R-40+rnd()*70;reeds.push({x,h:40+rnd()*50,ph:rnd()*6});}
const streaks=[];for(let i=0;i<140;i++)streaks.push({x:RIVER_L+rnd()*(RIVER_R-RIVER_L),y:WY+12+Math.pow(rnd(),1.4)*300,l:20+rnd()*60,sp:50+rnd()*70});

// ---------------- characters ----------------
function ik(sx,sy,tx,ty,l1,l2,elbowForward){
  let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy);const m=l1+l2-.01;if(d>m){dx*=m/d;dy*=m/d;d=m;}if(d<1e-3)d=1e-3;
  const th=Math.atan2(dx,dy),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1)),be=Math.acos(clamp((l1*l1+l2*l2-d*d)/(2*l1*l2),-1,1));
  return elbowForward?[th-al,Math.PI-be]:[th+al,-(Math.PI-be)];
}
function limb(g,x,y,a1,l1,a2,l2,w1,w2,col){

// ---------------- story timeline ----------------
const SRT=`1
00:00:01,000 --> 00:00:04,500
The Clever Monkey and the Greedy Crocodile
A Jungle Adventure Full of Tricks and Laughter

2
00:00:05,000 --> 00:00:09,000
Once upon a time, there lived a clever little monkey
in a beautiful tropical jungle.

3
00:00:09,500 --> 00:00:14,000
One day, the monkey wanted to cross a wide river.
But the river was very deep, and the water flowed strongly.

4
00:00:14,200 --> 00:00:17,500
There were no trees nearby,
so he couldn't jump from one tree to another.

5
00:00:18,000 --> 00:00:22,000
The monkey sat on the riverbank, scratching his head
and wondering how he could get to the other side.

6
00:00:22,300 --> 00:00:24,500
"Oh dear! How am I going to cross this river?"

7
00:00:25,000 --> 00:00:27,000
Suddenly, a crocodile appeared from the water.

8
00:00:27,500 --> 00:00:30,500
"Hello, my little friend!
Why are you sitting here looking so sad?"

9
00:00:30,800 --> 00:00:32,800
"I want to cross the river, but I don't know how!"

10
00:00:33,200 --> 00:00:36,500
"That's easy! Climb onto my back.
I'll carry you safely across the river."

11
00:00:36,800 --> 00:00:39,500
The monkey was delighted.
"Really? That's very kind of you!"

12
00:00:40,000 --> 00:00:43,500
The monkey happily climbed onto the crocodile's back,
and they started swimming across the river.

13
00:00:43,800 --> 00:00:45,500
But the crocodile had a secret plan.

14
00:00:46,000 --> 00:00:50,000
"Hehehe! Once we reach the middle of the river,
I'll dive underwater and make this little monkey my dinner!"

15
00:00:50,500 --> 00:00:53,000
Everything seemed fine as they swam through the water.

16
00:00:53,500 --> 00:00:56,500
But when they reached the middle of the river,
the crocodile suddenly began to dive underwater.

17
00:00:57,000 --> 00:00:59,000
"Hey! Hey! What are you doing?" shouted the monkey.

18
00:00:59,500 --> 00:01:03,000
The crocodile didn't say a word.
Instead, he thought: "You fool! Don't you know I'm going to eat you?"

19
00:01:03,500 --> 00:01:07,500
The monkey was terrified. He suddenly realized the danger
and knew he had to think quickly to save himself.

20
00:01:08,000 --> 00:01:10,000
Suddenly, an idea came to his mind.

21
00:01:10,500 --> 00:01:12,800
"Wait! Wait! My friend!"

23
00:01:15,200 --> 00:01:19,500
"Oh, I almost forgot! I want to bring my auntie with me.
She's waiting on the riverbank."

24
00:01:19,800 --> 00:01:23,800
"She's very fat and much bigger than me.
She's too heavy to walk, so she needs a ride."

25
00:01:24,200 --> 00:01:27,000
"I'm just a skinny little monkey,
but my auntie is a much bigger meal!"

26
00:01:27,500 --> 00:01:31,000
The greedy crocodile started thinking:
"Hmm! If I take him back, I can get two monkeys instead of one!"

27
00:01:31,500 --> 00:01:34,500
"And if his auntie is really that fat,
I'll have a much bigger meal!"

28
00:01:35,000 --> 00:01:37,800
"That's a wonderful idea!
Let's go back and get your auntie!"

29
00:01:38,200 --> 00:01:41,200
The crocodile quickly turned around
and swam back towards the riverbank.

30
00:01:41,700 --> 00:01:46,000
As soon as they reached the shore, the clever monkey jumped off
and quickly climbed up a nearby tree.

31
00:01:46,500 --> 00:01:49,500
Then he looked down at the crocodile
and burst out laughing.

32
00:01:50,000 --> 00:01:54,500
"Ha! Ha! Ha! Do you really think I'm a fool?
You tried to trick me, but I'm much cleverer than you!"

33
00:01:55,000 --> 00:01:57,000
The crocodile looked up in surprise.
"Hey! Come back! Where is your auntie?"

34
00:01:57,500 --> 00:02:00,000
The monkey laughed even louder.
"My auntie? She's safe at home!"

35
00:02:00,300 --> 00:02:02,500
"And you can forget about your dinner!"

36
00:02:03,000 --> 00:02:05,500
The crocodile floated sadly in the river,
with an empty stomach.

37
00:02:06,000 --> 00:02:09,000
The monkey sat comfortably on a tree branch,
enjoying his victory.

38
00:02:09,500 --> 00:02:12,000
"Next time, don't underestimate a clever monkey!"

39
00:02:12,500 --> 00:02:16,000
And that's how the clever little monkey
escaped from the greedy crocodile.

40

function camAt(t,croc,monk){
  let sh=SHOTS[SHOTS.length-1];for(const S of SHOTS)if(t>=S[0]&&t<S[1]){sh=S;break;}
  if(sh[0]===4.9){ // tracking the vine swing
    return {x:monk.x+40,y:monk.y-80,z:1.55,r:-(monk.rot||0)*.25};}
  const k=sm(seg(t,sh[0],sh[1])),A=sh[2](croc,monk),B=(sh[3]||sh[2])(croc,monk);
  const c={x:lerp(A.x,B.x,k),y:lerp(A.y,B.y,k),z:lerp(A.z,B.z,k),r:lerp(A.r||0,B.r||0,k)};
  if(sh[0]===56.1){c.z=lerp(A.z,B.z,sm(seg(t,56.1,56.45)));}                 // crash zoom happens fast
  if(sh[0]===63.3){c.x+=Math.sin(RT*37)*3;c.y+=Math.cos(RT*29)*3;}            // fear shake
  return c;
}

function drawUnderwaterLight(g,cam){
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<9;i++){const x=cam.x-700+i*170+Math.sin(RT*.6+i)*30;g.fillStyle=lin(g,0,WY,0,WY+420,[[0,'rgba(200,240,255,.10)'],[1,'rgba(200,240,255,0)']]);
    g.beginPath();g.moveTo(x,WY);g.lineTo(x+60,WY);g.lineTo(x+150,WY+420);g.lineTo(x+40,WY+420);g.fill();}
  g.restore();
}
function drawBackground(g,t,cam){
  g.drawImage(sky,0,0);
  for(const c of clouds){const x=mod(c.x-cam.x*.03+t*5,W+700)-350;g.drawImage(c.img,x,c.y);}
  const z1=1+(cam.z-1)*.15,z2=1+(cam.z-1)*.3;
  const surf=H/2+(WY-cam.y)*cam.z, hz=clamp(surf-620,-420,320);
  for(const [img,par,z,dy] of [[farHills,.08,z1,hz*.9],[midJungle,.2,z2,hz*.97]]){
    const sx=mod(cam.x*par,W*2);g.save();g.translate(W/2,H*.62+dy);g.scale(z,z);g.translate(-W/2,-H*.62);g.drawImage(img,-sx,0);g.drawImage(img,W*2-sx,0);g.restore();}
  // sun rays
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){const a=Math.PI*.6+i*.12+Math.sin(t*.2+i)*.02,L=1500;
    g.fillStyle=lin(g,1250,140,1250+Math.cos(a)*L,140+Math.sin(a)*L,[[0,'rgba(255,250,215,.04)'],[1,'rgba(255,250,215,0)']]);
    g.beginPath();g.moveTo(1250,140);g.lineTo(1250+Math.cos(a-.06)*L,140+Math.sin(a-.06)*L);g.lineTo(1250+Math.cos(a+.06)*L,140+Math.sin(a+.06)*L);g.fill();}
  g.restore();
}

function wrapText(g,lines,cx,y,lh){lines.forEach((l,i)=>{g.strokeText(l,cx,y+i*lh);g.fillText(l,cx,y+i*lh);});}
function drawSubtitles(g,t){

  const lh=44,n=c.text.length,wmax=Math.max(...c.text.map(l=>g.measureText(l).width));
  const by=H-40-n*lh;g.fillStyle='rgba(15,20,30,.55)';const bx=W/2-wmax/2-26;
  g.beginPath();g.roundRect(bx,by-8,wmax+52,n*lh+16,16);g.fill();
  g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.75)';g.fillStyle='#fff9e6';g.lineJoin='round';

  // corner leaves
  for(const [x,y,a] of [[px+10,py+10,.6],[px+pw-10,py+10,2.5],[px+10,py+ph-10,-.6],[px+pw-10,py+ph-10,-2.5]]){g.save();g.translate(x,y);g.rotate(a);for(let i=-1;i<=1;i++){g.save();g.rotate(i*.5);leafShape(g,60,16);fs(g,'#56a03c','rgba(25,60,20,.8)',1.6);g.restore();}g.restore();}
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#7a2e0c';g.font='bold 54px "Trebuchet MS", sans-serif';g.fillText('The Moral of the Story',W/2,py+80);
  g.fillStyle='#3a2410';g.font='bold 38px "Trebuchet MS", sans-serif';g.fillText('Intelligence is more powerful than strength.',W/2,py+185);
  g.font='italic 36px "Trebuchet MS", sans-serif';g.fillText('A clever mind can save you from any danger.',W/2,py+250);
  g.restore();
}

function renderAt(T){
  RT=T;const t=storyTime(T);
  const croc=crocAt(t),monk=monkeyAt(t,croc),cam=camAt(t,croc,monk);
  cam.w=W/cam.z*1.4;cam.l=cam.x-cam.w/2;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  ctx.save();if(cam.r){ctx.translate(W/2,H/2);ctx.rotate(cam.r);const os=1+Math.abs(cam.r)*1.25;ctx.scale(os,os);ctx.translate(-W/2,-H/2);}
  drawBackground(ctx,RT,cam);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
  drawWorld(ctx,t,cam,croc,monk);
  if(cam.y>WY+60)drawUnderwaterLight(ctx,cam);
  ctx.restore();ctx.restore();
  // warm grade, sunset glow at the end, vignette
  ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle=`rgba(255,${200-60*sm(seg(t,132.5,135))},${130-60*sm(seg(t,132.5,135))},${.22+.25*sm(seg(t,132.5,135))})`;ctx.fillRect(0,0,W,H);ctx.restore();
  ctx.fillStyle=rad(ctx,W/2,H*.5,H*1.05,[[0,'rgba(0,0,0,0)'],[.6,'rgba(0,0,0,0)'],[1,'rgba(10,15,10,.45)']]);ctx.fillRect(0,0,W,H);
  drawTitle(ctx,t);drawMoral(ctx,t);drawSubtitles(ctx,t);
  // fade in / out
  const fo=Math.max(1-seg(T,0,.8),seg(T,TOTAL-.7,TOTAL));if(fo>0){ctx.fillStyle=`rgba(0,0,0,${fo})`;ctx.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;

// live playback (loops); frozen-time rendering overrides performance.now
const t0=performance.now();
function frame(now){renderAt(((now-t0)/1000)%TOTAL);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>

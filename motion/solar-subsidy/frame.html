<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }</script>
<style>body{margin:0}canvas{width:1080px;height:1920px}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three'; window.THREE = THREE;
const load = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
await load('lib/stage.js'); await load('lib/sound.js'); await load('style.js');
const style = STYLES[STYLES.length - 1];
const S = await K.run(document.getElementById("c"), style, { samples: +(new URLSearchParams(location.search).get("n") || 4), width: 1080, height: 1920 });
const q = new URLSearchParams(location.search);
if (q.get('shadow')) { const k = +q.get('shadow'); S.scene.traverse((o) => { if (o.isLight && o.shadow && o.castShadow) o.shadow.mapSize.setScalar(Math.max(512, o.shadow.mapSize.x * k)); }); }   // cheaper shadows for long software renders
window.S = S; window.style = style; window.DURATION = style.duration; window.seek = (t, n) => S.seek(t, n); window.READY = true;
</script></body></html>

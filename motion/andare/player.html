<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Hoppers for Little Andare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #050403; color: #f3e7d0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 56px 0; display: grid; place-items: center; }
  canvas#stage { width: min(100vw, calc((100vh - 56px) * 16 / 9)); aspect-ratio: 16 / 9; height: auto; display: block; background: #000; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #15100c; border-top: 1px solid #2a2018; }
  button, label.btn { background: #2a2018; color: #f3e7d0; border: 1px solid #3a2d22; border-radius: 7px; padding: 6px 11px; font: inherit; cursor: pointer; white-space: nowrap; }
  button.on { background: #e2604a; border-color: #e2604a; color: #fff; }
  #scrub { flex: 1; accent-color: #e2604a; min-width: 60px; }
  #time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; color: #b9a88e; }
  #vo { color: #b9a88e; max-width: 22vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #drop { position: absolute; inset: 0; display: none; place-items: center; background: rgba(226, 96, 74, 0.25); border: 3px dashed #e2604a; font-size: 22px; z-index: 5; }
  #msg { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: #b9a88e; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="stage" width="1920" height="1080"></canvas><div id="msg">Building the book…</div></div>
<div id="bar">
  <button id="play" disabled>▶ Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <span id="time">0:00.0</span>
  <button id="snd" class="on" title="Sound effects">Sound on</button>
  <button id="loop" class="on">Loop</button>
  <label class="btn" for="file">Load voiceover</label><input id="file" type="file" accept="audio/*">
  <span id="vo"></span>
</div>
<div id="drop">Drop the voiceover audio file</div>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
// STAGE: a small film-style rendering kit for three.js motion graphics. Classic script; needs a global THREE (core only,
// no addons). It gives every style the same pipeline:
//   - one clock: stage.seek(t) builds the whole frame for time t, so frames can be rendered alone and in any order
//   - accumulation rendering: each frame is the average of N sub-renders, which gives real motion blur, anti-aliasing,
//     true depth of field (the camera moves across a lens aperture) and soft area-light shadows (lights move across
//     their own surface), all without post-process tricks
//   - HDR bloom, tone mapping, vignette, grain, chromatic aberration and a crisp 2D overlay for captions
//   - code-built lighting environments (no HDRI files), a real mirror floor, canvas textures, text planes, easing,
//     seeded random and noise
// Globals: K (helpers) and registerStyle(). A style is { id, name, ..., render: {...}, build(S) -> { update(t), overlay? } }.
(function (root) {
  const THREE = root.THREE;
  const K = {};
  const STYLES = [];
  root.STYLES = STYLES;
  root.registerStyle = (s) => { STYLES.push(s); return s; };

  // ---------------------------------------------------------------- maths
  K.clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  K.lerp = (a, b, t) => a + (b - a) * t;
  K.map = (x, a, b, c, d) => c + (d - c) * K.clamp((x - a) / (b - a));
  K.smooth = (a, b, x) => { const t = K.clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

  K.ease = {
    linear: (t) => t,
    in: (t) => t * t * t,
    out: (t) => 1 - Math.pow(1 - t, 3),
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outQuint: (t) => 1 - Math.pow(1 - t, 5),
    inOutQuint: (t) => (t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2),
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
    outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
    inBack: (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t,
    outElastic: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1),
    outBounce: (t) => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
  };
  // damped spring from 0 to 1 starting at time 0 (t in seconds). freq in Hz, damp 0..1 (1 = no overshoot)
  K.spring = (t, freq = 2.2, damp = 0.45) => {
    if (t <= 0) return 0;
    const w = 2 * Math.PI * freq;
    if (damp >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
    const wd = w * Math.sqrt(1 - damp * damp);

  };
  // keyframe track: K.track([[0, [0,2,8]], [3, [2,2,6], 'inOut'], [6, 5, K.ease.out]]) -> f(t). Values are numbers or
  // arrays; the ease on a key shapes the move INTO that key.
  K.track = (keys) => (t) => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {

        const fn = typeof e === 'function' ? e : K.ease[e || 'inOut'];
        const u = fn((t - t0) / (t1 - t0));
        return Array.isArray(v0) ? v0.map((a, k) => a + (v1[k] - a) * u) : v0 + (v1 - v0) * u;
      }
    }
    return keys[keys.length - 1][1];
  };

  // like K.track, but the value flows smoothly THROUGH the middle keys without stopping at them (it only eases in at
  // the first key and out at the last). Use it for camera moves that should feel like one continuous shot.
  K.path = (keys) => {
    const n = keys.length, arr = Array.isArray(keys[0][1]), val = (i) => (arr ? keys[i][1] : [keys[i][1]]), dim = val(0).length;
    const m = keys.map((_, i) => (i === 0 || i === n - 1 ? new Array(dim).fill(0) : val(i).map((_, k) => (val(i + 1)[k] - val(i - 1)[k]) / (keys[i + 1][0] - keys[i - 1][0]))));
    return (t) => {
      if (t <= keys[0][0]) return keys[0][1];
      if (t >= keys[n - 1][0]) return keys[n - 1][1];
      let i = 1; while (keys[i][0] < t) i++;
      const t0 = keys[i - 1][0], h = keys[i][0] - t0, u = (t - t0) / h, u2 = u * u, u3 = u2 * u;
      const a = val(i - 1), b = val(i), out = a.map((_, k) => (2 * u3 - 3 * u2 + 1) * a[k] + (u3 - 2 * u2 + u) * h * m[i - 1][k] + (-2 * u3 + 3 * u2) * b[k] + (u3 - u2) * h * m[i][k]);
      return arr ? out : out[0];
    };
  };

  // ---------------------------------------------------------------- seeded random and noise
  K.rng = (seed) => {
    let a = (typeof seed === 'string' ? [...seed].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) : seed * 2654435761) >>> 0;
    const r = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    r.range = (lo, hi) => lo + (hi - lo) * r();
    r.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * r());
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    r.sign = () => (r() < 0.5 ? -1 : 1);
    return r;
  };
  // a stable 0..1 hash of up to three numbers (handy for per-instance variation without storing arrays)
  K.hash = (x, y = 0, z = 0) => { let h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123; return h - Math.floor(h); };
  K.noise = (seed = 1) => {
    const r = K.rng(seed), p = new Uint8Array(512), perm = Array.from({ length: 256 }, (_, i) => i);
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const grad = (h, x, y, z) => { const u = (h & 15) < 8 ? x : y, v = (h & 15) < 4 ? y : (h & 15) === 12 || (h & 15) === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    const n3 = (x, y, z) => {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z), A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      const L = K.lerp;
      return L(L(L(grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z), u), L(grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z), u), v),
        L(L(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u), L(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    };
    const fbm = (x, y, z = 0, oct = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); a *= 0.5; f *= 2; } return s; };
    return { n3, n2: (x, y) => n3(x, y, 0), fbm };
  };
  const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
  K.halton = halton;

  // ---------------------------------------------------------------- textures, text, geometry
  // K.canvasTex(1024, 512, (ctx, w, h) => {...}) -> THREE.CanvasTexture (sRGB, mipmapped). Redraw with tex.redraw(fn).
  K.canvasTex = (w, h, draw, opts = {}) => {
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    if (draw) draw(ctx, w, h);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = opts.data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    tex.anisotropy = 8; tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter;
    if (opts.repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(opts.repeat[0], opts.repeat[1]); }
    tex.redraw = (fn) => { ctx.clearRect(0, 0, w, h); fn(ctx, w, h); tex.needsUpdate = true; };
    tex.canvas2d = cv; tex.ctx = ctx;
    return tex;
  };
  // A flat piece of text living in the 3D world. K.textPlane('Hello', { font: '800 160px "Inter"', color: '#fff',
  // height: 0.5 }) -> Mesh whose world height is `height` units per line. opts: align, lineHeight, glow (emissive
  // multiplier for bloom), lit (use a lit material so it takes shadows), maxWidthPx, letterSpacing (px), pad (px).
  K.textPlane = (text, o = {}) => {
    const font = o.font || '700 160px "Inter"', px = +(/(\d+(?:\.\d+)?)px/.exec(font) || [0, 160])[1];
    const lines = String(text).split('\n'), lh = (o.lineHeight || 1.12) * px, pad = o.pad == null ? Math.ceil(px * 0.25) : o.pad;
    const m = document.createElement('canvas').getContext('2d'); m.font = font;
    if (o.letterSpacing) m.letterSpacing = o.letterSpacing + 'px';
    const wpx = Math.ceil(Math.max(...lines.map((l) => m.measureText(l).width))) + pad * 2, hpx = Math.ceil(lh * lines.length) + pad * 2;
    const tex = K.canvasTex(wpx, hpx, (ctx) => {
      ctx.font = font; if (o.letterSpacing) ctx.letterSpacing = o.letterSpacing + 'px';
      ctx.textBaseline = 'middle'; ctx.textAlign = o.align || 'center'; ctx.fillStyle = o.color || '#ffffff';
      const x = o.align === 'left' ? pad : o.align === 'right' ? wpx - pad : wpx / 2;
      lines.forEach((l, i) => ctx.fillText(l, x, pad + lh * (i + 0.5)));
    });
    const unit = (o.height || 1) / px, hWorld = hpx * unit, wWorld = wpx * unit; // `height` = world size of the font's px size
    const mat = o.lit
      ? new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.02, roughness: o.roughness == null ? 0.8 : o.roughness, metalness: 0 })
      : new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
    if (o.glow && !o.lit) mat.color.setScalar(o.glow);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wWorld, hWorld), mat);
    mesh.userData.size = [wWorld, hWorld]; mesh.userData.tex = tex;
    return mesh;
  };
  // Box with rounded edges, centred on the origin. r = edge radius, seg = roundness.
  K.roundedBox = (w, h, d, r = 0.05, seg = 6) => {
    r = Math.max(1e-4, Math.min(r, w / 2, h / 2, d / 2));
    const N = 2 * seg + 1, g = new THREE.BoxGeometry(2, 2, 2, N, N, N), p = g.attributes.position, nrm = g.attributes.normal;
    const half = [w / 2 - r, h / 2 - r, d / 2 - r], v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      const c = [p.getX(i), p.getY(i), p.getZ(i)], inner = [0, 0, 0], a = [0, 0, 0];
      for (let k = 0; k < 3; k++) {
        const idx = Math.round((c[k] + 1) * N / 2), side = idx <= seg ? -1 : 1;
        a[k] = idx <= seg ? -(1 - idx / seg) : (idx - seg - 1) / seg; inner[k] = side * half[k];
      }
      v.set(Math.tan(a[0] * Math.PI / 4), Math.tan(a[1] * Math.PI / 4), Math.tan(a[2] * Math.PI / 4)).normalize();
      p.setXYZ(i, inner[0] + v.x * r, inner[1] + v.y * r, inner[2] + v.z * r); nrm.setXYZ(i, v.x, v.y, v.z);
    }
    // UVs: each of the six sides is mapped flat, 0..1 across the whole side, so textures are not stretched at the corners
    const uv = g.attributes.uv, per = (N + 1) * (N + 1), sz = [w, h, d];
    const ax = [[2, 1, -1], [2, 1, 1], [0, 2, 1, -1], [0, 2, 1, 1], [0, 1, 1], [0, 1, -1]];   // [u axis, v axis, u sign, v sign] for +x -x +y -y +z -z
    for (let i = 0; i < p.count; i++) {
      const f = ax[Math.min(5, Math.floor(i / per))], c = [p.getX(i), p.getY(i), p.getZ(i)];
      uv.setXY(i, f[2] * c[f[0]] / sz[f[0]] + 0.5, (f[3] || 1) * c[f[1]] / sz[f[1]] + 0.5);
    }
    g.computeBoundingBox(); g.computeBoundingSphere();
    return g;
  };
  // Flat rounded rectangle (a card, a screen, a tile), in the XY plane facing +Z, with UVs 0..1 across it.
  K.roundedRect = (w, h, r = 0.05, seg = 8) => {
    const s = new THREE.Shape(), x = w / 2, y = h / 2; r = Math.min(r, x, y);
    s.moveTo(-x + r, -y); s.lineTo(x - r, -y); s.absarc(x - r, -y + r, r, -Math.PI / 2, 0); s.lineTo(x, y - r); s.absarc(x - r, y - r, r, 0, Math.PI / 2);
    s.lineTo(-x + r, y); s.absarc(-x + r, y - r, r, Math.PI / 2, Math.PI); s.lineTo(-x, -y + r); s.absarc(-x + r, -y + r, r, Math.PI, Math.PI * 1.5);
    const g = new THREE.ShapeGeometry(s, seg), p = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / w + 0.5, p.getY(i) / h + 0.5);
    return g;
  };
  // Tube along a list of [x,y,z] points (smooth Catmull-Rom). closed loops allowed.
  K.tube = (pts, radius = 0.05, o = {}) => {
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], p[2] || 0)), !!o.closed, 'centripetal');
    const g = new THREE.TubeGeometry(curve, o.segments || Math.max(8, pts.length * 3), radius, o.radial || 12, !!o.closed);
    g.userData.curve = curve;
    return g;
  };
  // Set instance i of an InstancedMesh: K.place(mesh, i, [x,y,z], [rx,ry,rz], scale | [sx,sy,sz]). Call
  // mesh.instanceMatrix.needsUpdate = true once after a batch.
  const _o = new THREE.Object3D();
  K.place = (mesh, i, p, r, s) => {
    _o.position.set(p[0], p[1], p[2]); if (r) _o.rotation.set(r[0], r[1], r[2]); else _o.rotation.set(0, 0, 0);
    if (s == null) _o.scale.set(1, 1, 1); else if (typeof s === 'number') _o.scale.set(s, s, s); else _o.scale.set(s[0], s[1], s[2]);
    _o.updateMatrix(); mesh.setMatrixAt(i, _o.matrix);
  };
  // Camera: position, look-at target, optional fov and roll. K.focus sets the lens: focus distance (or a point to
  // focus on) and aperture radius in world units (0 = everything sharp).
  const _v = new THREE.Vector3();

    cam.position.set(pos[0], pos[1], pos[2]); cam.up.set(0, 1, 0); cam.lookAt(target[0], target[1], target[2]);
    if (roll) cam.rotateZ(roll);

  };
  K.focus = (cam, at, aperture) => {
    cam.userData.focus = typeof at === 'number' ? at : _v.set(at[0], at[1], at[2]).distanceTo(cam.position);
    if (aperture != null) cam.userData.aperture = aperture;
  };

  // ---------------------------------------------------------------- lighting
  // Code-built lighting environment for reflections and soft fill (replaces an HDRI). K.env(S, { top, horizon,
  // bottom: sky gradient colours; panels: [{ pos:[x,y,z], size:[w,h], color, power }] bright rectangles that face the
  // origin (softboxes, windows, a sun); intensity; background: true to also show it behind the scene; blur }).
  // Metal and glass can only shine if the environment has something bright in it.
  K.env = (S, o = {}) => {
    const es = new THREE.Scene();
    const sky = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 24), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: { top: { value: new THREE.Color(o.top || '#0b0d12') }, hor: { value: new THREE.Color(o.horizon || o.top || '#14171f') }, bot: { value: new THREE.Color(o.bottom || o.horizon || '#050506') }, gain: { value: o.skyPower == null ? 1 : o.skyPower } },
      vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vD; uniform vec3 top, hor, bot; uniform float gain; void main(){ float y = normalize(vD).y; vec3 c = y > 0.0 ? mix(hor, top, pow(y, 0.6)) : mix(hor, bot, pow(-y, 0.5)); gl_FragColor = vec4(c * gain, 1.0); }',
    }));
    es.add(sky);
    for (const p of o.panels || []) {
      const c = new THREE.Color(p.color || '#ffffff').multiplyScalar(p.power == null ? 5 : p.power);
      const m = new THREE.Mesh(p.round ? new THREE.CircleGeometry((p.size ? p.size[0] : 4) / 2, 40) : new THREE.PlaneGeometry(p.size ? p.size[0] : 4, p.size ? p.size[1] : 4), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
      m.position.set(p.pos[0], p.pos[1], p.pos[2]); m.lookAt(0, p.aimY || 0, 0); es.add(m);
    }
    const pm = new THREE.PMREMGenerator(S.renderer);
    const rt = pm.fromScene(es, o.blur == null ? 0.02 : o.blur, 0.1, 200);
    pm.dispose();
    S.scene.environment = rt.texture;
    S.scene.environmentIntensity = o.intensity == null ? 1 : o.intensity;
    if (o.background) { S.scene.background = rt.texture; S.scene.backgroundBlurriness = o.backgroundBlur == null ? 0.5 : o.backgroundBlur; S.scene.backgroundIntensity = o.backgroundIntensity == null ? 1 : o.backgroundIntensity; }
    return rt.texture;
  };
  // A shadow-casting spot light with a real size: `soft` is the radius of the light's surface in world units, which
  // gives true soft-edged shadows (bigger = softer). o: pos, target, color, power, angle, penumbra, soft, mapSize, near, far.
  K.spot = (S, o = {}) => {

        const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(bits.range(0.5, 1.3), bits.range(-0.1, 0.2)); sh.lineTo(bits.range(0.2, 0.9), bits.range(0.35, 0.8)); if (i % 2) sh.lineTo(bits.range(-0.2, 0.1), bits.range(0.4, 0.7));
        const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: CARD_T, bevelEnabled: false }), [new THREE.MeshStandardMaterial({ color: inks[i % inks.length], roughness: 0.93 }), core]);
        m.rotation.set(-Math.PI / 2, 0, bits.range(0, 6.3)); m.position.set(x, TABLE_Y + 0.002, z); m.castShadow = m.receiveShadow = true; scene.add(m);
      });
      // a cup of plain tea, as you would have with hoppers
      const glaze = new THREE.MeshStandardMaterial({ color: '#1d3a44', roughness: 0.3 }), mug = new THREE.Group(); mug.position.set(-6.9, TABLE_Y, -6.2); scene.add(mug);
      const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.85, 2.0, 40), glaze); cup.position.y = 1.0; const ear = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.13, 12, 32), glaze); ear.position.set(1.05, 1.0, 0.3); ear.rotation.y = -0.3; mug.add(cup, ear); mug.traverse((m) => { m.castShadow = m.receiveShadow = true; });
      const pencil = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 5.2, 6), new THREE.MeshStandardMaterial({ color: '#d99a1e', roughness: 0.45 })); pencil.rotation.set(Math.PI / 2, 0, 1.25); pencil.position.set(6.6, TABLE_Y + 0.1, -5.4); pencil.castShadow = pencil.receiveShadow = true; scene.add(pencil);

      K.env(S, { top: '#2a2119', horizon: '#3d3024', bottom: '#6b5740', intensity: 1.0, panels: [{ pos: [9, 11, 7], size: [7, 7], color: '#ffd9a6', power: 3 }, { pos: [-12, 6, -9], size: [6, 8], color: '#8fa8ff', power: 1.1 }] });
      K.spot(S, { pos: [4.5, 9.5, 11], target: [-0.2, 0.8, 0], color: '#ffe9d0', power: 1250, angle: 0.62, penumbra: 0.85, soft: 1.3, mapSize: S.R.lampMap || 4096 });
      K.spot(S, { pos: [-8, 5.5, -10], target: [0, 1, 0], color: '#c2d0ff', power: 150, angle: 0.5, penumbra: 1, shadow: false });
      K.skyLight(S, { color: '#ffe8d2', power: 1.1, size: 9, center: [0, 0, 0] });

      // ------------------------------------------------------------ 6. camera: one slow continuous move. Across each spread it
      // drifts (alternating direction), breathes out while a page turns, and ends in a gentle push.
      const camKeys = [], aimKeys = [];
      SPREADS.forEach((sp, s) => {
        const L = Math.max(0, landed(s)), T = s + 1 < SPREADS.length ? TURNS[s + 1] : DUR, dir = s % 2 ? -1 : 1, last = s === SPREADS.length - 1;
        if (s > 0) { camKeys.push([TURNS[s] + TURN * 0.5, [0, 6.45, 12.1]]); aimKeys.push([TURNS[s] + TURN * 0.5, [0, 1.1, 0.3]]); }
        camKeys.push([L + 0.4, [-0.75 * dir, 6.0, 11.4]]); aimKeys.push([L + 0.4, [-0.12 * dir, 1.05, 0.3]]);
        if (last) { camKeys.push([DUR - 1.2, [0.55, 5.6, 10.6]]); aimKeys.push([DUR - 1.2, [0.35, 1.0, 0.45]]); camKeys.push([DUR, [0.6, 5.58, 10.55]]); aimKeys.push([DUR, [0.36, 1.0, 0.45]]); }
        else { camKeys.push([T - 0.1, [0.75 * dir, 6.0, 11.4]]); aimKeys.push([T - 0.1, [0.12 * dir, 1.05, 0.3]]); }
      });
      camKeys[0][0] = 0; aimKeys[0][0] = 0;
      const cam = { pos: K.path(camKeys), aim: K.path(aimKeys) };

      const riseOf = (j, t) => K.seg(t, TURNS[j], TURNS[j] + TURN * 0.5, K.ease.inOut), sinkOf = (j, t) => K.seg(t, TURNS[j] + TURN * 0.6, TURNS[j] + TURN, K.ease.inOut);
      return {
        update(t) {
          const phi = TURNS.map((t0) => flip(t, t0));
          let onRight = 0, onLeft = 0;
          leaves.forEach((m, j) => { let below = 0; for (let i = 0; i < j; i++) below += 1 - riseOf(i, t); for (let i = j + 1; i < leaves.length; i++) below += sinkOf(i, t); m.rotation.z = phi[j]; m.position.y = -STEP * below; onRight += 1 - riseOf(j, t); onLeft += sinkOf(j, t); });
          blockR.position.y = STEP - LEAF_T / 2 - STEP * onRight; blockL.position.y = STEP - LEAF_T / 2 - STEP * onLeft;   // each block's top meets the lowest page on its side
          tab.position.set(K.lerp(TAB.x[0], TAB.x[1], pulled(t)), CARD_T / 2 + 0.004, TAB.z);
          spreads.forEach((sp, s) => {
            const aL = Math.PI - phi[s], aR = s + 1 < phi.length ? phi[s + 1] : 0;
            sp.group.visible = aL + aR < Math.PI - 0.02;
            if (sp.group.visible) { const h = hinge(aL, aR); sp.parts.forEach((p) => p.pose(h, t)); }
          });
          K.look(camera, cam.pos(t), cam.aim(t)); K.focus(camera, [0, 1.0, 1.35], 0.11);
        },
      };
    },

    sound(k) {
      k.bed('room', 0, DUR, { gain: 1.0 });
      k.music('pad', 0, DUR, { bpm: 72, chords: [['F3', 'A3', 'C4', 'E4'], ['D3', 'F3', 'A3', 'C4'], ['Bb2', 'D3', 'F3', 'A3'], ['C3', 'E3', 'G3', 'Bb3']], gain: 0.45 });
      // the fire on the cover: soft crackle
      k.withMinor(() => { const r = K.rng(77); for (let x = 0.3; x < TURNS[1]; x += 0.09 + r() * 0.25) k.noise(x, { dur: 0.02, filter: 'bandpass', f: 1800 + r() * 2500, q: 1.5, gain: 0.05 + r() * 0.06, pan: r() * 0.6 - 0.3 }); });
      const NOTES = ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'A5', 'G5', 'E5', 'D5', 'C5'];
      TURNS.forEach((t0, s) => {
        const hit = landed(s);
        if (t0 > 0) { k.play('paper', t0 + 0.02, { gain: 1.4, dur: 0.5, pan: 0.4 }); k.play('whoosh', t0 + 0.3, { gain: 0.55, dur: 0.8, top: 1500 }); k.play('paper', t0 + 0.5, { gain: 0.9, dur: 0.7 }); }
        k.withMinor(() => { for (let i = 0; i < 7; i++) if (hit - 0.62 + i * 0.085 > 0) k.play('tick', hit - 0.62 + i * 0.085, { gain: 0.45 + 0.06 * i, f: 1900 + i * 260, pan: -0.3 + i * 0.1 }); });   // card creaking upright
        if (hit > 0) { k.play('slap', hit, { gain: 0.6, pan: -0.3 }); k.play('thud', hit, { gain: 0.5, f: 105, pan: -0.3 }); k.play('paper', hit + 0.04, { gain: 0.45, dur: 0.22 }); }
        k.play('ding', Math.max(0.05, hit + 0.14), { gain: 0.26, f: NOTES[s % NOTES.length] });
        k.withMinor(() => { for (let i = 0; i < 4; i++) if (hit + 0.19 > 0) k.play('tick', hit + 0.19 + i * 0.3, { gain: 0.14 - 0.03 * i, f: 5200, pan: 0.2 }); });   // pieces trembling on their arms
      });
      const chink = (t, i = 0, g = 1) => { k.tone(t, { f: 2600 + 380 * (i % 3), dur: 0.35, gain: 0.07 * g, verb: 0.2, pan: 0.1 * i }); k.tone(t, { f: (2600 + 380 * (i % 3)) * 2.4, dur: 0.15, gain: 0.03 * g, pan: 0.1 * i }); k.play('tick', t, { gain: 0.4 * g, f: 5800 }); };
      REVEALS.forEach(({ at, kind }) => {
        const t = at - 0.3;                                                     // the piece breaks the page here
        k.withMinor(() => { k.play('tape', t, { gain: 0.6, dur: 0.32, pan: 0.15 }); k.play('tick', at + 0.15, { gain: 0.35, f: 3000 }); });
        if (kind === 'ribbon') k.withMinor(() => { k.play('paper', t, { gain: 0.5, dur: 0.3 }); k.play('tock', at + 0.15, { gain: 0.35, f: 640 }); });
        else if (kind === 'coins4' || kind === 'tinycoins') k.withMinor(() => { for (let i = 0; i < 4; i++) chink(at + i * 0.09, i, kind === 'tinycoins' ? 0.7 : 1); });
        else if (kind === 'toss') { for (let i = 0; i < 4; i++) chink(at + 0.25 + i * 0.11, i, 0.9); k.play('swish', at - 0.05, { gain: 0.6 }); }
        else if (kind === 'dust') k.play('whoosh', at - 0.1, { gain: 0.55, dur: 0.6, pan: 0.5 });
        else if (kind === 'feather') k.play('swish', at - 0.1, { gain: 0.5, dur: 0.5 });
        else if (kind === 'idea') k.play('sparkle', at, { gain: 0.8, n: 5 });
        else if (kind === 'speech') k.play('blip', at, { gain: 0.7, f: 'A5' });
        else if (kind === 'ghost') k.play('riser', at - 0.4, { gain: 0.4, dur: 0.6 });
        else if (kind === 'reveal') { k.play('press', at + 0.1, { gain: 0.8 }); k.tone(at + 0.25, { f: 'E5', dur: 0.4, gain: 0.12, verb: 0.3 }); k.tone(at + 0.5, { f: 'C5', dur: 0.8, gain: 0.12, verb: 0.3 }); for (let i = 0; i < 4; i++) chink(at + 0.12 + i * 0.07, i, 0.6); }
        else if (kind === 'burst') k.play('stamp', at, { gain: 1.0 });
        else k.play('pop', at + 0.12, { gain: 0.55, f: kind === 'person' ? 480 : 640, minor: kind !== 'person' });
      });
      // the pull tab: Andare runs home
      k.play('tape', RUN[0], { gain: 1.2, dur: RUN[1] - RUN[0], pan: 0.4 }); k.play('paper', RUN[0], { gain: 0.7, dur: 0.7, pan: 0.4 });
      k.play('tock', RUN[1], { gain: 0.55, f: 500, pan: 0.4 }); k.play('success', RUN[1] + 0.12, { gain: 0.6, f: 'C6' });
      k.play('ding', BEATS[BEATS.length - 1].t[1] + 0.15, { gain: 0.3, f: 'G5' });
    },
  });
}

const style = window.STYLES[window.STYLES.length - 1];
const q = new URLSearchParams(location.search);
const RENDER = q.has('render');                                     // headless video render: no player clock
const LIVE = 3, FULL = +(q.get('samples')) || style.render.samples;    // live preview samples / samples for rendered frames
const canvas = document.getElementById('stage');
if (q.get('map')) style.render.lampMap = +q.get('map');            // a smaller lamp shadow map for slow software renders
const S = await K.run(canvas, style, { samples: RENDER ? FULL : LIVE, width: +(q.get('w')) || 1920, height: +(q.get('h')) || 1080 });
const D = style.duration;
window.seek = (t) => S.seek(t);
window.DURATION = D;
// the effects score as 16-bit stereo, base64, for the video render
window.renderSound = async (sr = 48000) => {
  const r = await SOUND.renderOffline((k) => style.sound(k), D, sr, { voiceover: true });
  const pcm = new Int16Array(r.inter.length); for (let i = 0; i < pcm.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, Math.round(r.inter[i] * 32767)));
  const u8 = new Uint8Array(pcm.buffer); let bin = ''; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(bin), peak: r.peak, sr };
};
document.getElementById('msg').remove();
if (RENDER) { window.READY = true; }
else {
  const $ = (id) => document.getElementById(id);
  const playBtn = $('play'), scrub = $('scrub'), time = $('time'), sndBtn = $('snd'), loopBtn = $('loop');
  let playing = false, t = 0, last = 0, audio = null, stopSound = null, soundOn = true, loop = true, dirty = true, idle = 0;
  const fmt = (x) => { const m = Math.floor(x / 60), s = x - m * 60; return `${m}:${s.toFixed(1).padStart(4, '0')}`; };
  const stopFx = () => { if (stopSound) { stopSound(); stopSound = null; } };
  const startFx = () => { stopFx(); if (soundOn && playing) stopSound = SOUND.live((k) => style.sound(k), t, { voiceover: true }); };
  function play() {
    if (t >= D - 0.01) t = 0;
    playing = true; playBtn.textContent = '❚❚ Pause';
    if (audio) { audio.currentTime = Math.min(t, audio.duration || t); audio.play().catch(() => {}); }
    last = performance.now(); startFx();
  }
  function pause() { playing = false; playBtn.textContent = '▶ Play'; if (audio) audio.pause(); stopFx(); dirty = true; idle = performance.now(); }
  function seekTo(x) { t = Math.max(0, Math.min(D, x)); if (audio) audio.currentTime = Math.min(t, audio.duration || t); stopFx(); if (playing) startFx(); dirty = true; idle = performance.now(); }
  playBtn.onclick = () => (playing ? pause() : play()); playBtn.disabled = false;
  scrub.oninput = () => seekTo(+scrub.value * D);
  sndBtn.onclick = () => { soundOn = !soundOn; sndBtn.classList.toggle('on', soundOn); sndBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; soundOn ? startFx() : stopFx(); };
  loopBtn.onclick = () => { loop = !loop; loopBtn.classList.toggle('on', loop); };
  document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  function loadAudio(file) {
    if (!file || !/^audio\//.test(file.type) && !/\.(wav|mp3|m4a|ogg|aac|flac)$/i.test(file.name)) return;
    if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); }
    audio = new Audio(URL.createObjectURL(file)); audio.preload = 'auto';
    audio.onended = () => { if (loop) { seekTo(0); play(); } else pause(); };
    $('vo').textContent = '🎙 ' + file.name;
    const was = playing; pause(); audio.addEventListener('loadedmetadata', () => { seekTo(t); if (was) play(); }, { once: true });
  }
  $('file').onchange = (e) => loadAudio(e.target.files[0]);
  const drop = $('drop'); let depth = 0;
  addEventListener('dragenter', (e) => { e.preventDefault(); depth++; drop.style.display = 'grid'; });
  addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; drop.style.display = 'none'; } });
  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', (e) => { e.preventDefault(); depth = 0; drop.style.display = 'none'; loadAudio(e.dataTransfer.files[0]); });
  let sharp = false;
  function frame(now) {
    if (playing) {
      if (audio) t = audio.currentTime;                              // with a voiceover, the audio is the clock
      else { t += (now - last) / 1000; last = now; }
      if (t >= D && !audio) { if (loop) { t = 0; startFx(); } else { t = D; pause(); } }
      S.seek(Math.min(t, D), LIVE); sharp = false;
    } else if (dirty) { S.seek(t, LIVE); dirty = false; sharp = false; }
    else if (!sharp && now - idle > 400) { S.seek(t, 16); sharp = true; }   // paused: settle into a cleaner still
scrub.value = String(t / D); time.textContent = `${fmt(t)} / ${fmt(D)}`;
    requestAnimationFrame(frame);
  }
  // without a voiceover file the piece loops on its own clock; with one, it loops when the audio ends
  setInterval(() => { if (playing && audio && t >= D) { if (loop) { seekTo(0); } else pause(); } }, 200);
  requestAnimationFrame(frame);
}
</script>
